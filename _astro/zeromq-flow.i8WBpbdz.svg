<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" viewBox="0 0 1200 560"><title>ZeroMQ message flow</title><desc>An application sends multipart message frames through a ZeroMQ socket pattern and transport to a receiving ZeroMQ socket and application.</desc><defs><marker id="b" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#555" d="m0 0 10 5-10 5z"/></marker><filter id="a" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".12" stdDeviation="5"/></filter></defs><rect width="1200" height="560" fill="#f7f7f8" rx="20"/><text x="600" y="48" fill="#222" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">How ZeroMQ moves a message</text><text x="600" y="78" fill="#666" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Your code chooses the socket pattern; ZeroMQ handles queues, framing, routing, and I/O.</text><g filter="url(#a)"><rect width="220" height="150" x="55" y="150" fill="#fff" stroke="#ccc" stroke-width="2" rx="16"/><text x="165" y="188" fill="#222" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Sending app</text><text x="165" y="220" fill="#555" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Publisher / producer</text><rect width="130" height="32" x="100" y="245" fill="#eee" rx="8"/><text x="165" y="267" fill="#333" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">send(frames)</text></g><g filter="url(#a)"><rect width="240" height="200" x="350" y="125" fill="#fff7ed" stroke="#e58a32" stroke-width="3" rx="16"/><text x="470" y="165" fill="#222" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">ZeroMQ socket</text><text x="470" y="194" fill="#555" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">PUB / PUSH / REQ</text><rect width="160" height="35" x="390" y="220" fill="#f1c27d" rx="7"/><text x="470" y="243" fill="#333" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">topic | payload</text><text x="470" y="285" fill="#555" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">queues + routing</text></g><g filter="url(#a)"><rect width="240" height="200" x="610" y="125" fill="#eef6ff" stroke="#558ac8" stroke-width="3" rx="16"/><text x="730" y="165" fill="#222" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Transport</text><text x="730" y="200" fill="#555" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">framed message parts</text><path stroke="#558ac8" stroke-dasharray="10 8" stroke-width="4" marker-end="url(#b)" d="M650 235h160"/><text x="730" y="280" fill="#555" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">background I/O</text></g><g filter="url(#a)"><rect width="240" height="200" x="910" y="125" fill="#fff" stroke="#ccc" stroke-width="2" rx="16"/><text x="1030" y="165" fill="#222" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">ZeroMQ socket</text><text x="1030" y="194" fill="#555" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">SUB / PULL / REP</text><rect width="120" height="35" x="970" y="220" fill="#d9e8f7" rx="7"/><text x="1030" y="243" fill="#333" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">receive()</text><text x="1030" y="285" fill="#555" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">queues + routing</text></g><path stroke="#555" stroke-width="4" marker-end="url(#b)" d="M275 225h65"/><path stroke="#555" stroke-width="4" marker-end="url(#b)" d="M600 225h300"/><path stroke="#555" stroke-width="4" marker-end="url(#b)" d="M1160 225h15"/><rect width="980" height="95" x="110" y="390" fill="#fff" stroke="#ccc" stroke-width="2" rx="16"/><text x="600" y="424" fill="#222" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">The same model works across transports</text><text x="600" y="459" fill="#555" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">inproc  ·  IPC  ·  TCP  ·  UDP  ·  multicast  ·  WebSocket</text></svg>